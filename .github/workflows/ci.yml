name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  dco:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a Developer Certificate of Origin sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: tools/check-dco.sh "$BASE" "$HEAD"

  conformance:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: just check

  release:
    if: github.ref_type == 'tag'
    needs: conformance
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SREF_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Require a release tag
        run: |
          if ! [[ "$SREF_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "not a release tag: $SREF_RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python3 tools/release.py --version "${SREF_RELEASE_TAG#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_notes.py "${SREF_RELEASE_TAG#v}" > dist/release-notes.md
          gh release create "$SREF_RELEASE_TAG" \
            --verify-tag \
            --title "SREF ${SREF_RELEASE_TAG#v}" \
            --notes-file dist/release-notes.md \
            "dist/sref-${SREF_RELEASE_TAG}.tar.gz" \
            "dist/sref-${SREF_RELEASE_TAG}.tar.gz.sha256"
